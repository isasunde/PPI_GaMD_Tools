[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppi-gamd-reweighting"
version = "0.1.0"
description = "Tools for energetic reweighting of PPI-GaMD simulations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]